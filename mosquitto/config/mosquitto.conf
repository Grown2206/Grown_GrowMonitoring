# Grow Monitoring System - Mosquitto Configuration for Docker

# Listeners
listener 1883
protocol mqtt

listener 9001
protocol websockets

# Security (Development - no auth)
allow_anonymous true

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Persistence
persistence true
persistence_location /mosquitto/data/

# Retained Messages
retained_persistence true
autosave_interval 1800

# Connection
max_connections -1
max_keepalive 65535

# Performance
message_size_limit 0
